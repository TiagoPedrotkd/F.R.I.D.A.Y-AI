run_id: cpt-fase2-pilot
seed: 42
model_config: friday-llm/configs/base_model.yaml
use_smoke_model: true
data_file: friday-llm/data/pretraining/cpt_fase1.jsonl
output_dir: friday-llm/checkpoints/cpt-fase2-pilot
report_path: friday-llm/reports/cpt_fase2_pilot.json
max_steps: 50
seq_length: 512
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
warmup_steps: 2
logging_steps: 5
save_steps: 25
resume_from_checkpoint: true
fp16: false
bf16: false
optim: paged_adamw_8bit
gradient_checkpointing: true
report_to: none
