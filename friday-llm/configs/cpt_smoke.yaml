run_id: cpt-smoke-v0
seed: 42
model_config: friday-llm/configs/base_model.yaml
use_smoke_model: true
data_glob: friday-llm/data/pretraining/*.jsonl
output_dir: friday-llm/checkpoints/cpt-smoke
max_steps: 20
seq_length: 512
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
warmup_ratio: 0.03
logging_steps: 1
save_steps: 20
fp16: false
bf16: false
optim: paged_adamw_8bit
gradient_checkpointing: true
report_to: none
