run_id: sft-fase2-pilot
seed: 42
model_config: friday-llm/configs/base_model.yaml
use_smoke_model: true
adapter_path: friday-llm/checkpoints/cpt-fase2-pilot
train_file: friday-llm/data/sft/fase1_sft_train.jsonl
eval_file: friday-llm/data/sft/fase1_sft_holdout.jsonl
output_dir: friday-llm/checkpoints/sft-fase2-pilot
report_path: friday-llm/reports/sft_fase2_pilot.json
max_steps: 40
seq_length: 1024
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
warmup_steps: 2
logging_steps: 5
save_steps: 20
resume_from_checkpoint: true
fp16: false
bf16: false
optim: paged_adamw_8bit
gradient_checkpointing: true
report_to: none
