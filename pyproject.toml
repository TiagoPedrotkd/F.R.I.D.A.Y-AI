[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday-ai"
version = "0.2.0a1"
description = "F.R.I.D.A.Y-AI conversational voice core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.55.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1.0",
    "openwakeword>=0.6.0",
    "sounddevice>=0.5.0",
    "piper-tts>=1.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
friday-voice = "friday.pipeline.loop:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["friday*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
