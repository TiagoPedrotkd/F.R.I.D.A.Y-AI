services:
  healthcheck:
    build:
      context: ./services/healthcheck
      dockerfile: Dockerfile
    container_name: friday-healthcheck
    ports:
      - "${HEALTHCHECK_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-microsoft/phi-4}
      LM_STUDIO_API_KEY: ${LM_STUDIO_API_KEY:-lm-studio}
      HEALTHCHECK_PORT: "8080"
      HEALTHCHECK_HOST: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Fase 2 — CalDAV local (Radicale)
  radicale:
    image: tomsquest/docker-radicale:3.3.2.0
    container_name: friday-radicale
    ports:
      - "${CALDAV_PORT:-5232}:5232"
    volumes:
      - radicale_data:/data
    environment:
      TAKE_FILE_OWNERSHIP: "true"
    restart: unless-stopped

  # Fase 3 — MQTT (profile: mqtt)
  mosquitto:
    profiles: ["mqtt", "homeassistant"]
    image: eclipse-mosquitto:2
    container_name: friday-mosquitto
    ports:
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
    volumes:
      - ./deploy/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  # Fase 3 — Home Assistant (profile: homeassistant)
  homeassistant:
    profiles: ["homeassistant"]
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: friday-homeassistant
    depends_on:
      - mosquitto
    ports:
      - "127.0.0.1:${HA_PORT:-8123}:8123"
    volumes:
      - ha_config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Lisbon
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Fase 3 — Frigate stub (profile: frigate) — NÃO arranca por defeito
  frigate:
    profiles: ["frigate"]
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: friday-frigate
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:8554:8554"
    volumes:
      - ./deploy/frigate/config.yml:/config/config.yml:ro
      - frigate_media:/media/frigate
    environment:
      TZ: Europe/Lisbon
    restart: unless-stopped
    # GPU: descomentar quando Coral/NVIDIA estiverem prontos
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  radicale_data:
  ha_config:
  frigate_media:
